[pytest]
testpaths = tests
addopts = -q -p no:cacheprovider
# ask-sdk-model and botocore docstrings use invalid escapes: a SyntaxWarning
# on 3.12, a DeprecationWarning on 3.8. Upstream noise, not our code.
filterwarnings =
    ignore::SyntaxWarning
    ignore:invalid escape sequence:DeprecationWarning
